services:
  postgres:
    container_name: postgres-fitnessHub
    image: postgres
    environment:
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${DB}
    volumes:
      - postgres:/data/postgres
    ports:
      - 5432:5432
    restart: unless-stopped
    networks:
      - fitnessHub_network

networks:
  fitnessHub_network:
    driver: bridge

volumes:
  postgres: